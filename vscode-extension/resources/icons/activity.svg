<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <clipPath id="frame">
      <rect x="1.2" y="1.8" width="21.6" height="20.4" rx="2.4"/>
    </clipPath>
    <!-- 红绿灯与横条：从标题栏灰底中挖去的真镂空——任何单灰度渲染下都透出底色 -->
    <mask id="bandHoles">
      <rect x="1.2" y="1.8" width="21.6" height="4.1" fill="#fff"/>
      <circle cx="4.8" cy="3.85" r="0.85" fill="#000"/>
      <circle cx="7.2" cy="3.85" r="0.85" fill="#000"/>
      <circle cx="9.6" cy="3.85" r="0.85" fill="#000"/>
      <rect x="14.2" y="2.95" width="6" height="1.8" rx="0.9" fill="#000"/>
    </mask>
  </defs>
  <!-- 标题栏：灰底，占窗高约 20%，镂空控件，裁进窗框上圆角 -->
  <rect x="1.2" y="1.8" width="21.6" height="4.1" fill="#9a9a9a" fill-opacity="0.55"
        clip-path="url(#frame)" mask="url(#bandHoles)"/>
  <!-- 窗体外框：细边线，体部透明 -->
  <rect x="1.2" y="1.8" width="21.6" height="20.4" rx="2.4" fill="none" stroke="#8f8f8f" stroke-width="0.4"/>
  <!-- π：Segoe UI Semibold——scripts/generate-icon.py 生成 logo 用的同一字体 -->
  <text x="12" y="12.3" font-family="'Segoe UI Semibold', 'Segoe UI', sans-serif" font-weight="600" font-size="12.5"
        text-anchor="middle" dominant-baseline="central" fill="#8f8f8f">π</text>
</svg>
