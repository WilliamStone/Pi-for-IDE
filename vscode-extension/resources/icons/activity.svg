<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
  <!-- 窗体外框：透明体内，描边吃主题色 -->
  <rect x="2" y="2.4" width="20" height="19.2" rx="3.2" stroke-width="1.7"/>
  <!-- 标题栏带（占比放大到 ~35%）：分隔线 + 红绿灯 + 标题横条 -->
  <path d="M2 9.4 h20" stroke-width="1.5"/>
  <circle cx="5.1" cy="6" r="1.15" fill="currentColor" stroke="none"/>
  <circle cx="7.9" cy="6" r="1.15" fill="currentColor" stroke="none"/>
  <circle cx="10.7" cy="6" r="1.15" fill="currentColor" stroke="none"/>
  <rect x="13.4" y="5.3" width="6.6" height="1.4" rx="0.7" fill="currentColor" stroke="none"/>
  <!-- π 字形：横梁 + 两条腿（左收右撇） -->
  <path d="M7.6 13.2 h9" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M10.1 13.2 v4.9 c0 1 -0.5 1.6 -1.6 2" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M14.6 13.2 v4.2 c0 1.3 0.8 2.1 2.1 2.4" stroke-width="1.7" stroke-linecap="round"/>
</svg>
